name: unzip
description: Utility for extracting files from ZIP archives
category: utils
version_flag: unzip --version

install:
  apt:
    steps:
      - cmd: apt-get install -y unzip
        sudo: true

  pacman:
    steps:
      - cmd: pacman -Syu --noconfirm unzip
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y unzip
        sudo: true

verify:
  cmd: unzip -v
  expect: "UnZip"

post_install:
  message: ""