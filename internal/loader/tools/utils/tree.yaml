name: tree
description: Command-line utility for displaying directory structures as a tree
category: utils
version_flag: tree --version

install:
  apt:
    steps:
      - cmd: apt-get install -y tree
        sudo: true

  pacman:
    steps:
      - cmd: pacman -Syu --noconfirm tree
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y tree
        sudo: true

verify:
  cmd: tree --version
  expect: "tree"

post_install:
  message: ""