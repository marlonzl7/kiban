name: git
description: Distributed version control system
category: utils
version_flag: git --version

install:
  apt:
    steps:
      - cmd: apt-get install -y git
        sudo: true

  pacman:
    steps:
      - cmd: pacman -S --noconfirm git
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y git
        sudo: true

verify:
  cmd: git --version
  expect: "git version"

post_install:
  message: ""