name: xsel
description: Command-line tool for accessing and manipulating the X11 clipboard
category: utils
version_flag: xsel --version

install:
  apt:
    steps:
      - cmd: apt-get install -y xsel
        sudo: true

  pacman:
    steps:
      - cmd: pacman -S --noconfirm xsel
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y xsel
        sudo: true

verify:
  cmd: xsel --version
  expect: "xsel version"

post_install:
  message: ""