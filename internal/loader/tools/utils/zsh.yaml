name: zsh
description: Interactive shell with advanced customization features
category: utils
version_flag: zsh --version

install:
  apt:
    steps:
      - cmd: apt-get install -y zsh
        sudo: true

  pacman:
    steps:
      - cmd: pacman -Syu --noconfirm zsh
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y zsh
        sudo: true

verify:
  cmd: zsh --version
  expect: "zsh"

post_install:
  message: ""