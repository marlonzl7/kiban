name: java
description: Java Development Kit
category: languages
version_flag: java -version
default_version: "25"

install:
  apt:
    steps:
      - cmd: apt-get install -y openjdk-{{version}}-jdk
        sudo: true

  pacman:
    steps:
      - cmd: pacman -Syu --noconfirm jdk{{version}}-openjdk
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y java-{{version}}-openjdk
        sudo: true

verify:
  cmd: java -version
  expect: openjdk version

post_install:
  message: ""