name: node
description: JavaScript runtime built on Chrome's V8 engine
category: languages
version_flag: node --version
default_version: "24"

install:
  apt:
    steps:
      - cmd: apt-get update
        sudo: true
      - cmd: apt-get install -y ca-certificates curl gnupg
        sudo: true
      - cmd: install -m 0755 -d /etc/apt/keyrings
        sudo: true
      - cmd: rm -f /etc/apt/sources.list.d/nodesource.sources /etc/apt/keyrings/nodesource.gpg
        sudo: true
      - cmd: gpg --batch --list-keys > /dev/null 2>&1 || true
        shell: true
      - cmd: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/nodesource.gpg > /dev/null
        shell: true
      - cmd: |
          sudo tee /etc/apt/sources.list.d/nodesource.sources <<EOF
          Types: deb
          URIs: https://deb.nodesource.com/node_{{version}}.x
          Suites: nodistro
          Components: main
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/nodesource.gpg
          EOF
        shell: true
      - cmd: apt-get update
        sudo: true
      - cmd: apt-get install -y nodejs
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y nodejs{{version}}
        sudo: true
        
  pacman:
    steps:
      - cmd: pacman -S --noconfirm nodejs npm
        sudo: true

verify:
  cmd: node --version
  expect: "v"

post_install:
  message: "Nota: no Arch Linux (pacman), a versão instalada é sempre a mais recente disponível no repositório oficial, independentemente da versão especificada no setup.yaml. Em Ubuntu/apt e Fedora/dnf, a versão solicitada é respeitada."