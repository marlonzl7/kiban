name: python
description: General-purpose high-level programming language
category: languages
version_flag: python3 --version

install:
  apt:
    steps:
      - cmd: apt-get install -y python3 python3-pip
        sudo: true
  dnf:
    steps:
      - cmd: dnf install -y python3 python3-pip
        sudo: true
  pacman:
    steps:
      - cmd: pacman -S --noconfirm python python-pip
        sudo: true

verify:
  cmd: python3 --version
  expect: "Python"

post_install:
  message: ""