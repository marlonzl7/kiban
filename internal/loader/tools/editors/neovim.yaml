name: neovim
description: Extensible text editor based on Vim
category: utils
version_flag: nvim --version

install:
  apt:
    steps:
      - cmd: apt-get install -y neovim
        sudo: true

  pacman:
    steps:
      - cmd: pacman -S --noconfirm neovim
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y neovim
        sudo: true

verify:
  cmd: nvim --version
  expect: "NVIM"

post_install:
  message: ""