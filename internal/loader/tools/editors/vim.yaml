name: vim
description: Terminal-based modal text editor
category: utils
version_flag: vim --version

install:
  apt:
    steps:
      - cmd: apt-get install -y vim
        sudo: true

  pacman:
    steps:
      - cmd: pacman -Syu --noconfirm vim
        sudo: true

  dnf:
    steps:
      - cmd: dnf install -y vim
        sudo: true

verify:
  cmd: vim --version
  expect: VIM

post_install:
  message: ""