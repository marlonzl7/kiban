name: docker
description: Container runtime
category: containers
version_flag: docker --version

install:
  apt:
    steps:
      - cmd: apt-get update
        sudo: true
      - cmd: curl -fsSL https://get.docker.com | sh
        sudo: true
  dnf:
    steps:
      - cmd: dnf -y install docker
        sudo: true

verify:
  cmd: docker --version
  expect: "Docker version"

post_install:
  message: "Adicione seu usuário ao grupo docker: sudo usermod -aG docker $USER"